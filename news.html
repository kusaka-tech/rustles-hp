<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEWS | 南山大学チアリーディング部 Rustles</title>
    <meta
        name="description"
        content="南山大学チアリーディング部 Rustlesのお知らせをご紹介します。"
    >

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================
           NEWS PAGE
        ========================== */

        .news-page {
            min-height: 100vh;
            padding: 150px 20px 100px;
            position: relative;
            overflow: hidden;
            background: #fff;
        }

        .news-page-inner {
            width: min(900px, 100%);
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .news-page-heading {
            margin-bottom: 55px;
        }

        .news-page-heading .section-en {
            margin-bottom: 8px;
        }

        .news-page-heading h1 {
            margin: 0;
            font-size: clamp(32px, 5vw, 48px);
            letter-spacing: 0.04em;
        }

        /* 背景の大きな星 */

        .news-bg-star {
            position: absolute;
            font-size: 150px;
            line-height: 1;
            opacity: 0.035;
            pointer-events: none;
        }

        .news-bg-star-red {
            color: #c40018;
        }

        .news-bg-star-black {
            color: #111;
        }

        .news-star-1 {
            top: 130px;
            right: 5%;
            transform: rotate(15deg);
        }

        .news-star-2 {
            bottom: 80px;
            left: 3%;
            transform: rotate(-15deg);
        }

        /* NEWS一覧 */

        .news-page-list {
            border-top: 1px solid #ddd;
        }

        .news-page-item {
            display: grid;
            grid-template-columns: 130px 1fr 30px;
            align-items: center;
            gap: 25px;

            padding: 25px 10px;
            border-bottom: 1px solid #ddd;

            text-decoration: none;
            color: #111;

            transition:
                background-color 0.25s ease,
                padding 0.25s ease;
        }

        .news-page-item:hover {
            background: #fafafa;
            padding-left: 18px;
            padding-right: 18px;
        }

        .news-page-date {
            font-size: 13px;
            color: #888;
            letter-spacing: 0.08em;
        }

        .news-page-title {
            margin: 0;
            font-size: 16px;
            line-height: 1.7;
            font-weight: 500;
        }

        .news-page-arrow {
            font-size: 20px;
            text-align: right;
            color: #c40018;
        }

        /* 記事本文 */

        .news-article {
            max-width: 820px;
            margin: 0 auto;
        }

        .news-article-date {
            margin: 0 0 15px;
            color: #888;
            font-size: 13px;
            letter-spacing: 0.08em;
        }

        .news-article-title {
            margin: 0;
            font-size: clamp(26px, 5vw, 42px);
            line-height: 1.5;
            letter-spacing: 0.03em;
        }

        .news-article-line {
            width: 45px;
            height: 2px;
            background: #c40018;
            margin: 30px 0 40px;
        }

        .news-article-content {
            font-size: 16px;
            line-height: 2;
            color: #333;
        }

        .news-article-content p {
            margin: 0 0 1.5em;
        }

        .news-article-content h2,
        .news-article-content h3,
        .news-article-content h4 {
            margin: 2em 0 0.8em;
            line-height: 1.6;
            color: #111;
        }

        .news-article-content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 30px auto;
            border-radius: 8px;
        }

        .news-article-content a {
            color: #c40018;
            text-decoration: underline;
        }

        .news-back {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            margin-top: 60px;
            padding: 14px 24px;

            border: 1px solid #111;
            color: #111;
            text-decoration: none;

            font-size: 13px;
            letter-spacing: 0.08em;

            transition:
                background-color 0.25s ease,
                color 0.25s ease;
        }

        .news-back:hover {
            background: #111;
            color: #fff;
        }

        /* 読み込み中・エラー */

        .news-loading,
        .news-error,
        .news-empty {
            padding: 50px 20px;
            text-align: center;
            color: #777;
            line-height: 1.8;
        }

        /* 戻る */

        .news-home-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 40px;

            color: #111;
            text-decoration: none;

            font-size: 13px;
            letter-spacing: 0.08em;
        }

        .news-home-link span {
            color: #c40018;
            font-size: 18px;
        }

        @media (max-width: 700px) {

            .news-page {
                padding: 120px 20px 70px;
            }

            .news-page-heading {
                margin-bottom: 35px;
            }

            .news-page-item {
                grid-template-columns: 90px 1fr 20px;
                gap: 12px;
                padding: 20px 5px;
            }

            .news-page-item:hover {
                padding-left: 8px;
                padding-right: 8px;
            }

            .news-page-date {
                font-size: 11px;
            }

            .news-page-title {
                font-size: 14px;
            }

            .news-page-arrow {
                font-size: 17px;
            }

            .news-article-content {
                font-size: 15px;
                line-height: 1.9;
            }

            .news-bg-star {
                font-size: 100px;
            }
        }
    </style>
</head>


<body>

    <!-- HEADER -->
    <header class="header">

        <a href="index.html#top" class="logo">
            <span class="logo-main">Rustles</span>
            <span class="logo-sub">
                NANZAN UNIVERSITY CHEERLEADING TEAM
            </span>
        </a>

        <button
            class="menu-button"
            id="menuButton"
            aria-label="メニューを開く"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav" id="nav">
            <a href="index.html#news">NEWS</a>
            <a href="index.html#schedule">SCHEDULE</a>
            <a href="index.html#about">ABOUT US</a>
            <a href="index.html#faq">FAQ</a>
            <a href="index.html#contact">CONTACT</a>
        </nav>

    </header>


    <main>

        <section class="news-page">

            <span
                class="news-bg-star news-bg-star-red news-star-1"
                aria-hidden="true"
            >★</span>

            <span
                class="news-bg-star news-bg-star-black news-star-2"
                aria-hidden="true"
            >★</span>


            <div class="news-page-inner">

                <a href="index.html#news" class="news-home-link">
                    <span>←</span>
                    Rustles TOP
                </a>


                <div class="news-page-heading" id="pageHeading">

                    <p class="section-en">NEWS</p>
                    <h1>お知らせ</h1>

                </div>


                <!-- NEWS一覧 -->
                <div id="newsList" class="news-page-list">

                    <p class="news-loading">
                        NEWSを読み込んでいます…
                    </p>

                </div>


                <!-- 記事詳細 -->
                <article
                    id="newsArticle"
                    class="news-article"
                    style="display: none;"
                >

                    <p id="articleDate" class="news-article-date"></p>

                    <h1
                        id="articleTitle"
                        class="news-article-title"
                    ></h1>

                    <div class="news-article-line"></div>

                    <div
                        id="articleContent"
                        class="news-article-content"
                    ></div>

                    <a
                        href="news.html"
                        class="news-back"
                    >
                        ← NEWS一覧に戻る
                    </a>

                </article>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-logo">
            <span>Rustles</span>
            <small>
                NANZAN UNIVERSITY CHEERLEADING TEAM
            </small>
        </div>

        <p>
            © Nanzan University Cheerleading Team Rustles
        </p>

    </footer>


    <script>

        /* =========================
           microCMS
        ========================== */

        const SERVICE_DOMAIN = "1dwr9xvbh2";
        const API_KEY = "hTaZYG2UbDa4PLAgunGpsPan8zjCgiT8Qwf2";

        const API_URL =
            `https://${SERVICE_DOMAIN}.microcms.io/api/v1/news`;


        /* =========================
           MOBILE MENU
        ========================== */

        const menuButton =
            document.getElementById("menuButton");

        const nav =
            document.getElementById("nav");


        menuButton.addEventListener("click", () => {

            menuButton.classList.toggle("active");
            nav.classList.toggle("active");

        });


        document.querySelectorAll(".nav a").forEach(link => {

            link.addEventListener("click", () => {

                menuButton.classList.remove("active");
                nav.classList.remove("active");

            });

        });


        /* =========================
           日付
        ========================== */

        function formatDate(dateString) {

            if (!dateString) {
                return "";
            }

            const date = new Date(dateString);

            if (Number.isNaN(date.getTime())) {
                return "";
            }

            const year =
                date.getFullYear();

            const month =
                String(date.getMonth() + 1).padStart(2, "0");

            const day =
                String(date.getDate()).padStart(2, "0");

            return `${year}.${month}.${day}`;

        }


        /* =========================
           NEWS一覧を表示
        ========================== */

        async function loadNewsList() {

            const newsList =
                document.getElementById("newsList");

            try {

                const response = await fetch(
                    `${API_URL}?limit=100`,
                    {
                        headers: {
                            "X-MICROCMS-API-KEY": API_KEY
                        }
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const data =
                    await response.json();


                if (
                    !data.contents ||
                    data.contents.length === 0
                ) {

                    newsList.innerHTML = `
                        <p class="news-empty">
                            現在、お知らせはありません。
                        </p>
                    `;

                    return;

                }


                newsList.innerHTML =
                    data.contents.map(item => {

                        const date =
                            formatDate(
                                item.publishedAt ||
                                item.createdAt
                            );


                        return `
                            <a
                                href="news.html?id=${encodeURIComponent(item.id)}"
                                class="news-page-item"
                            >

                                <time class="news-page-date">
                                    ${date}
                                </time>

                                <p class="news-page-title">
                                    ${escapeHTML(item.title || "")}
                                </p>

                                <span class="news-page-arrow">
                                    →
                                </span>

                            </a>
                        `;

                    }).join("");


            } catch (error) {

                console.error(
                    "microCMS NEWS取得エラー:",
                    error
                );


                newsList.innerHTML = `
                    <p class="news-error">
                        NEWSを読み込めませんでした。<br>
                        時間をおいて、もう一度お試しください。
                    </p>
                `;

            }

        }


        /* =========================
           NEWS詳細を表示
        ========================== */

        async function loadNewsArticle(id) {

            const pageHeading =
                document.getElementById("pageHeading");

            const newsList =
                document.getElementById("newsList");

            const article =
                document.getElementById("newsArticle");

            const articleDate =
                document.getElementById("articleDate");

            const articleTitle =
                document.getElementById("articleTitle");

            const articleContent =
                document.getElementById("articleContent");


            pageHeading.style.display = "none";
            newsList.style.display = "none";
            article.style.display = "block";


            try {

                const response = await fetch(
                    `${API_URL}/${encodeURIComponent(id)}`,
                    {
                        headers: {
                            "X-MICROCMS-API-KEY": API_KEY
                        }
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const item =
                    await response.json();


                articleDate.textContent =
                    formatDate(
                        item.publishedAt ||
                        item.createdAt
                    );


                articleTitle.textContent =
                    item.title || "";


                /*
                 * microCMSの「内容」は
                 * リッチエディタなので、
                 * HTMLとして表示します。
                 */
                articleContent.innerHTML =
                    item.content || "";


            } catch (error) {

                console.error(
                    "microCMS NEWS詳細取得エラー:",
                    error
                );


                articleDate.textContent = "";

                articleTitle.textContent =
                    "お知らせを読み込めませんでした。";

                articleContent.innerHTML = `
                    <p>
                        この記事を表示できませんでした。<br>
                        時間をおいて、もう一度お試しください。
                    </p>
                `;

            }

        }


        /* =========================
           HTMLエスケープ
        ========================== */

        function escapeHTML(value) {

            return value
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================
           初期処理
        ========================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const newsId =
            params.get("id");


        if (newsId) {

            loadNewsArticle(newsId);

        } else {

            loadNewsList();

        }

    </script>

</body>
</html>
